name: Build art pool

# Fetches objects from the museum APIs, geocodes them and commits public/data/pool.json.
# Runs on demand, monthly, and whenever the pool scripts change.
on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'Multiplier on per-source fetch limits (1 = ~10k candidate records)'
        default: '1'
      sources:
        description: 'Comma-separated sources'
        default: 'met,aic,cma'
  schedule:
    - cron: '17 6 1 * *'
  push:
    paths:
      - 'scripts/**'
      - 'src/geo/**'
      - '.github/workflows/build-pool.yml'

permissions:
  contents: write

concurrency:
  group: build-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A push that only touches geocoding re-uses the committed raw cache (fast, no API load);
      # scheduled / manual runs fetch fresh data.
      - name: Build pool
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -f data/raw/met.json.gz ] && ! git diff --name-only HEAD~1 HEAD | grep -q 'scripts/sources/'; then
            node scripts/build-pool.ts --from-cache
          else
            node scripts/build-pool.ts --scale "${{ inputs.scale || '1' }}" --sources "${{ inputs.sources || 'met,aic,cma' }}"
          fi
      - name: Commit pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/pool.json data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rebuild art pool [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
