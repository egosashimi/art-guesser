name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npx vitest run
      - run: npx vite build
